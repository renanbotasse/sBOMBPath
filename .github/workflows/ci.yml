name: sBOMBPath CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fixture smoke run
        run: |
          python -m sbombpath \
            --code-dir fixtures/sample_backend \
            --cves fixtures/sample_vuln_report.json \
            --output-dir sbombpath-report \
            --fail-on-exploitable || true
          test -f sbombpath-report/exploitable-paths.md
          test -f sbombpath-report/exploitable-paths.json
          test -f sbombpath-report/exploitable-paths.csv
          test -f sbombpath-report/exploitable-paths.html
